name: kothai_app
description: Kothai Keyboard host Flutter app
publish_to: 'none'
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  smooth_page_indicator: ^1.2.1
  loading_animation_widget: ^1.3.0
  kothai_core:
    path: ../../packages/core/kothai_core
  kothai_domain:
    path: ../../packages/domain/kothai_domain
  kothai_data:
    path: ../../packages/data/kothai_data
  kothai_ui:
    path: ../../packages/ui/kothai_ui
  feature_keyboard:
    path: ../../packages/features/keyboard
  feature_settings:
    path: ../../packages/features/settings
  infra_telemetry:
    path: ../../packages/infra/telemetry
  infra_remote_config:
    path: ../../packages/infra/remote_config
  infra_model_update:
    path: ../../packages/infra/model_update

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true


