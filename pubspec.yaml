name: kothai_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  flutter_svg: ^2.2.0
  font_awesome_flutter: ^10.9.0
  dotted_line: ^3.2.3
  form_field_validator: ^1.1.0
  firebase_core: ^2.25.4
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  google_sign_in: ^6.2.1
  loading_animation_widget: ^1.3.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/Kothai_logo.png
    - assets/images/auth_bg.png
    - assets/images/Gold_Icon.svg
    - assets/images/start_icon_green.png
    - assets/images/start_icon_pink.png
    - assets/images/start_icon_blue.png
    - assets/images/start_icon_purple.png
    - assets/images/resume_icon.png
    - assets/images/dice-game.png
    - assets/images/dice.svg
    - assets/images/chevron_up.svg

  fonts:
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansTamil-Black.ttf
          weight: 900
        - asset: assets/fonts/NotoSansTamil-Medium.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTamil-SemiBold.ttf
          weight: 300
        - asset: 'assets/fonts/Inter-VariableFont.ttf'
